services:
  db:
    image: mysql:8.0
    container_name: social_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: social_db
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: social_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: social_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    working_dir: /app
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: social_db
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data:
